name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - production

jobs:
  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck CLI
        run: bun run --cwd packages/cli typecheck

      - name: Build CLI
        run: bun run --cwd packages/cli build

      - name: Smoke test CLI
        run: bun run cli:test

  template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck template
        run: bun run --cwd packages/template typecheck

      - name: Lint template
        run: bun run --cwd packages/template lint

      - name: Test template
        run: bun run --cwd packages/template test

      - name: Build template
        run: bun run --cwd packages/template build
